[project]
name = "presence"
version = "0.0.1"
description = "A job-search companion you run yourself — local-first, messenger-native, free forever."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "Denis Baldakov" }]
keywords = ["job-search", "agents", "local-first", "telegram", "career"]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.55",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
