[project]
name = "presence"
version = "0.1.1"
description = "A job-search companion you run yourself — local-first, messenger-native, free forever."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "Denis Baldakov" }]
keywords = ["job-search", "agents", "local-first", "telegram", "career"]
dependencies = [
    "anthropic>=0.40",
    "flask>=3.0",
    "pymupdf>=1.24",
    "openai>=1.55",
    "pydantic>=2.7",
    "requests>=2.31",
    "pyyaml>=6.0",
    "segno>=1.6.6",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "keyring>=25.7.0",
    "zstandard>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
macapp = [
    "pyinstaller>=6.22,<7",
    "pyobjc-framework-cocoa>=12",
    "rumps>=0.4.0",
]

[project.scripts]
presence = "presence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
